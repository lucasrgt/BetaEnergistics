name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: java tools/harness/Verify.java

  betavault-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: lucasrgt/betavault
          ref: 22d28a06f1baf431365f0951f8a352d8995d734b
          path: .betaenergistics/dependencies/betavault
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: java tools/harness/Verify.java --integration
        env:
          BETAVAULT_ROOT: .betaenergistics/dependencies/betavault

  worldline-testkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew worldlineDoctor worldlineTest --no-daemon --stacktrace
        working-directory: tests/worldline
